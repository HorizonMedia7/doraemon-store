<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer circle backdrop -->
  <rect width="100" height="100" rx="28" fill="#090a0f"/>
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#magicGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Gadget Pocket / Futuristic Bell Icon -->
  <g transform="translate(18, 18)" filter="url(#glow)">
    <!-- Magic gadget pocket arch -->
    <path d="M 6 24 C 6 12 18 6 32 6 C 46 6 58 12 58 24 C 58 46 48 58 32 58 C 16 58 6 46 6 24 Z" fill="url(#magicGrad)" />
    <!-- Inner pocket slit -->
    <path d="M 16 28 C 16 38 23 44 32 44 C 41 44 48 38 48 28 Z" fill="#090a0f" />
    <path d="M 12 28 L 52 28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Magic Sparkles -->
    <circle cx="32" cy="18" r="4" fill="#ffffff" />
    <polygon points="50,10 52,15 57,17 52,19 50,24 48,19 43,17 48,15" fill="#fde047" />
  </g>
</svg>